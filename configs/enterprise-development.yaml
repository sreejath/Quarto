# Default base configuration template for Quarto.
# Connection URLs (jira.base_url and ado.org_url) can be configured directly
# in the browser UI, via .env (JIRA_BASE_URL, ADO_ORG_URL), or in configs/local/base.yaml.
# Statuses and work item types are discovered live from Jira and Azure DevOps during validation.

jira:
  base_url: https://your-org.atlassian.net
  jql: "project = PROJ ORDER BY key ASC"

ado:
  org_url: https://dev.azure.com/your-org
  project: Production
  area_path: null

paths:
  export_dir: ./export
  users_file: ./users.csv

mapping:
  history: true           # full revision history, comments, attachments, and worklogs
  link_mode: all          # parent/child, issue links, remote web links, and Git PR links

  types:
    Initiative: Epic
    Epic: Feature
    Story: Product Backlog Item
    User Story: Product Backlog Item
    Task: Task
    Bug: Bug
    Test: Test Case
    Sub-task: Task
    Subtask: Task
  type_tags: {}

  # Live validation queries Jira and Azure DevOps for all statuses/states and maps them
  # automatically (1:1 exact match -> configured map -> semantic synonym match -> category fallback).
  states:
    default: {}
  resolution_states:
    default: {"Won't Do": Removed, Duplicate: Removed, Cannot Reproduce: Removed}

  priority: {Urgent: 1, Highest: 1, High: 2, Medium: 3, Low: 4, Lowest: 4}

  description_field: {default: System.Description}
  points_jira_names: [Story Points, Story point estimate]      # first filled one wins
  points_field:
    default: Microsoft.VSTS.Scheduling.Effort
    Task: null
    Feature: null
    Epic: null
    Test Case: null

  jira_key_field: Custom.JiraKey      # where a type lacks it, the key is added as a tag
  custom_fields:
    - {ado: Microsoft.VSTS.Common.AcceptanceCriteria, label: "Acceptance Criteria", jira: ["Acceptance Criteria"], kind: html}
    - {ado: Custom.ReleaseNotes, label: "Release Notes", jira: ["Release Notes"], kind: html}

  tags:
    labels: true
    components: "component:"
    versions: "version:"
    jira_key: false

  sprints_to_iterations: true
  iteration_parent: null
  skip_future_sprints: true

  identity_domains: {}
  history_notes: true
