[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quarto"
version = "2.0.0"
description = "Full-fidelity Jira Cloud to Azure DevOps migration tool with interactive browser UI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "PyYAML>=6.0.1",
    "urllib3<2",
]

[project.scripts]
quarto = "quarto.cli:main"
quarto-ui = "quarto.ui.server:main"

[tool.setuptools.packages.find]
include = ["quarto*"]

[tool.setuptools.package-data]
"quarto.ui" = ["static/*"]
