# Optional per-project overrides for Azure DevOps destination projects.
# Any project in your Azure DevOps organization can be selected in the UI or via --to "<project>".
# Projects not listed here use the defaults in configs/enterprise-development.yaml with
# confirm_with_project_name: true and live status/type discovery from Azure DevOps.
# You can also place private organization-specific overrides in configs/local/targets.yaml (git-ignored).

Production:
  ado:
    area_path: Production\Platform Team
    confirm_with_project_name: true
  mapping:
    iteration_parent: Platform Team

Sandbox:
  ado:
    area_path: null
    create_area: false
    confirm_with_project_name: false       # a test/sandbox project, so "yes" is enough
  mapping:
    iteration_parent: null
    note_jira_status: true
    points_field:
      default: Microsoft.VSTS.Scheduling.Effort
      Task: null
    states:
      default:
        To Do: New
        Ready: Approved
        In Progress: Committed
        In Review: Committed
        QA: Committed
        Done: Done
      Task:
        To Do: To Do
        Ready: To Do
        In Progress: In Progress
        In Review: In Progress
        QA: In Progress
        Done: Done
