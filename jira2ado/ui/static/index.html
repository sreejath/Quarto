<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jira2ado — Select Migration Mode</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body data-page-mode="hub">
  <header class="bar">
    <div class="brand"><img src="/logo.svg" alt="" width="28" height="28" class="brand-logo">jira2ado<span class="brand-sub">Jira Cloud to Azure DevOps Migration Suite</span></div>
    <div class="who" id="who"></div>
    <div class="bar-actions">
      <button class="btn secondary btn-sm" id="help-btn" type="button" data-action="open-help">? Help &amp; Setup Guide</button>
      <button class="quiet" id="quit" type="button">Quit</button>
    </div>
  </header>
  <main class="layout" id="app">
    <aside class="rail" aria-label="Connection settings">
      <ol class="steps">
        <li class="step" id="step-connect"></li>
      </ol>
    </aside>
    <section class="manifest" id="manifest" aria-label="Migration Mode Selection"></section>
  </main>
  <div class="drawer-backdrop hidden" id="drawer-backdrop" data-action="close-drawer"></div>
  <aside class="drawer hidden" id="drawer" aria-label="Details drawer"></aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
